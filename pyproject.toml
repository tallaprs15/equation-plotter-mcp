[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "equation-plotter-mcp"
version = "1.0.0"
description = "Plot and analyse equations: exact symbolic analysis (domain, intercepts, turning points, asymptotes, conics) plus a rendered graph, as JSON, a CLI and an MCP server."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Srikant Tallapragada" }]
keywords = ["mcp", "model-context-protocol", "math", "graphing", "plotting", "sympy", "education", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "sympy>=1.12",      # BSD-3-Clause
    "numpy>=1.24",      # BSD-3-Clause
    "matplotlib>=3.7",  # Matplotlib License (PSF-based, permissive)
    "mcp>=2,<3",        # MIT (official Model Context Protocol SDK)
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/tallaprs15/equation-plotter-mcp"
Repository = "https://github.com/tallaprs15/equation-plotter-mcp"
Issues = "https://github.com/tallaprs15/equation-plotter-mcp/issues"

[project.scripts]
equation-plotter-mcp = "equation_plotter.mcp_server:main"
equation-plotter = "equation_plotter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
